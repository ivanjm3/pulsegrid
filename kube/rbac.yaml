# ServiceAccounts carry IRSA (IAM Roles for Service Accounts) annotations so
# pods get S3 access via a scoped IAM role instead of long-lived AWS keys —
# swap <ACCOUNT_ID> / role name for the roles Terraform creates
# (see terraform/main.tf: aws_iam_role.api / aws_iam_role.worker).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pulsegrid-api
  namespace: pulsegrid
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::<ACCOUNT_ID>:role/pulsegrid-api-dev"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pulsegrid-worker
  namespace: pulsegrid
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::<ACCOUNT_ID>:role/pulsegrid-worker-dev"
---
# Worker pods only need to read their own pod info (nothing in the codebase
# calls the Kubernetes API today) — kept minimal rather than granting
# anything broader.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pulsegrid-worker
  namespace: pulsegrid
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pulsegrid-worker
  namespace: pulsegrid
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pulsegrid-worker
subjects:
- kind: ServiceAccount
  name: pulsegrid-worker
  namespace: pulsegrid
---
# No eks.amazonaws.com/role-arn annotation here, unlike pulsegrid-api/
# pulsegrid-worker above: the analytics-consumer (task 42) never calls S3 or
# any other AWS API directly — it only talks to in-cluster Kafka and the RDS
# Postgres instance (network + password auth via the pulsegrid-db Secret,
# not IAM). Adding an unused IRSA role would be one more free-tier-irrelevant
# AWS resource for no benefit.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pulsegrid-analytics-consumer
  namespace: pulsegrid
