apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulsegrid-api
  namespace: pulsegrid
  labels:
    app: pulsegrid-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pulsegrid-api
  template:
    metadata:
      labels:
        app: pulsegrid-api
    spec:
      serviceAccountName: pulsegrid-api
      containers:
      - name: api
        image: pulsegrid/pulsegrid-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        - name: metrics
          containerPort: 8081
        envFrom:
        - configMapRef:
            name: pulsegrid-config
        - secretRef:
            name: pulsegrid-db
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: pulsegrid-api
  namespace: pulsegrid
spec:
  selector:
    app: pulsegrid-api
  ports:
  - name: http
    port: 80
    targetPort: 8080
  - name: metrics
    port: 8081
    targetPort: 8081
  type: ClusterIP
